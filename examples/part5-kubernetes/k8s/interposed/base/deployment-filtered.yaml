# The FILTERED cargo front door (ch20): provider -> sidecar-filter -> http door,
# wac-plug-composed into one app-filtered.wasm and run as a Wasm Pod via the
# containerd `wasmtime` shim. Identical deployment shape to the plain base
# cargo-http, with a distinct name so it runs side by side with the adapted
# composition for the live comparison.
#
#   * runtimeClassName: wasmtime — route this Pod to the Wasm shim, not runc.
#   * image: cargo-http-filtered:dev — overlays/minikube retags it to :minikube
#     and forces imagePullPolicy: Never (minikube image load, no registry).
#   * command: ["/app.wasm"] — module path inside the scratch rootfs.
#   * probes: tcpSocket on 8080 — GET / is a 404 (only /cargo/{id} routes), so a
#     TCP probe is the readiness signal; the real HTTP 200 + embargo 400 gate
#     lives in the verify/capture scripts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cargo-http-filtered
  namespace: part5-kubernetes
  labels:
    app.kubernetes.io/name: cargo-http-filtered
    app.kubernetes.io/part-of: part5-kubernetes
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cargo-http-filtered
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cargo-http-filtered
        app.kubernetes.io/part-of: part5-kubernetes
    spec:
      runtimeClassName: wasmtime
      containers:
        - name: cargo-http-filtered
          image: cargo-http-filtered:dev
          imagePullPolicy: IfNotPresent
          command: ["/app.wasm"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cargo-http-filtered
  namespace: part5-kubernetes
  labels:
    app.kubernetes.io/name: cargo-http-filtered
    app.kubernetes.io/part-of: part5-kubernetes
spec:
  selector:
    app.kubernetes.io/name: cargo-http-filtered
  ports:
    - name: http
      port: 8080
      targetPort: 8080
