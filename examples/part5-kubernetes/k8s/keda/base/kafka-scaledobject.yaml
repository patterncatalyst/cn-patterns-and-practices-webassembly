# ch23 serverless scale-to-zero — Kafka half, KEDA-owned design.
#
# This ScaledObject targets cargo-kafka-host (../../kafka-host/base/deployment.yaml),
# a plain Deployment, so KEDA drives spec.replicas directly from 0 (idle) up to
# 6 (the topic's partition count — one consumer-group member can own at most
# one partition at a time) as consumer-group lag on cargo-handling-events
# rises and falls. Same keda.sh/v1alpha1 API surface and scale-to-zero shape
# as the HTTP half (httpscaledobject.yaml); this is the plain `kafka` trigger
# equivalent.
#
# No TriggerAuthentication: ../../kafka/base/kafka.yaml's only listener is an
# unauthenticated internal `plain` listener (no SASL/mTLS). The commented
# block below is the reference shape for a SASL/SCRAM- or mTLS-authenticated
# broker.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cargo-kafka-host
  namespace: kafka
  labels:
    app: cargo-kafka-host
    app.kubernetes.io/part-of: part5-kubernetes
spec:
  scaleTargetRef:
    name: cargo-kafka-host
    kind: Deployment
  minReplicaCount: 0
  maxReplicaCount: 6 # capped at the topic's partition count (kafkatopic.yaml)
  cooldownPeriod: 30
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: cargo-kafka-kafka-bootstrap.kafka.svc:9092
        consumerGroup: cargo-handling
        topic: cargo-handling-events
        lagThreshold: "5"
        offsetResetPolicy: earliest
      # authenticationRef:
      #   name: cargo-kafka-scram-auth   # a TriggerAuthentication, only needed
      #                                  # if the broker enables SASL/mTLS

# Example TriggerAuthentication shape for a SASL/SCRAM-authenticated broker —
