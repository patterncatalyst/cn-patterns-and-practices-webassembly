# Helm values overlay for the wasmcloud-platform chart (0.1.2) on PLAIN
# minikube (docker driver + containerd runtime) — the ch23 Kafka-half
# counterpart to ../../openshift/values-crc.yaml.
#
# Only ONE of the two reasons that CRC overlay exists also applies here: the
# chart hard-codes NATS DNS at *.default.svc.cluster.local, and this install
# uses a dedicated "wasmcloud" namespace (kept consistent with the CRC
# convention even though plain minikube has no restricted-v2 namespace-tier
# reason to avoid "default") — so NATS addresses still need repointing at
# *.wasmcloud.svc.cluster.local.
#
# The SECOND CRC reason — dropping wadm's hard-coded
# securityContext.runAsUser/runAsGroup: 1000 because it falls outside a
# restricted-v2 namespace's assigned UID range — does NOT apply on minikube:
# minikube's default PodSecurity admission is permissive, so the chart's
# fixed UID/GID is left untouched here.
nats:
  natsBox:
    enabled: false
  config:
    cluster:
      # Standalone NATS, not a cluster — same reasoning as values-crc.yaml:
      # minikube is a single node, so the chart's default
      # (cluster.enabled: true) would block forever waiting for peers that
      # never exist.
      enabled: false
    jetstream:
      fileStore:
        pvc:
          size: 2Gi

wadm:
  wadm:
    config:
      nats:
        server: "nats://nats-headless.wasmcloud.svc.cluster.local"
