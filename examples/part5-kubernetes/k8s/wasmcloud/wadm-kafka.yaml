# wadm application manifest (OAM core.oam.dev/v1beta1) for the ch23 Kafka half
# on PLAIN minikube — three wasmCloud components wired by `link` traits at
# runtime (the SAME runtime-link shape as ch20's
# ../interposed (sidecar-filter) / ../../openshift/wadm-filtered.yaml, applied
# here to a messaging pipeline instead of an HTTP interposer chain):
#
#   messaging-kafka (capability, CONSUMER of cargo-handling-events)
#        --wasmcloud:messaging/handler-->  kafka-handler (component)
#   kafka-handler
#        --patterncatalyst:cargo/handling-->  cargo-provider-k (component, Part 2 reused)
#
# TEACHING POINT: KEDA OBSERVES, wadm OWNS. The `spreadscaler` trait on
# `kafka-handler` below is what sets its ACTUAL replica count — wadm
# continuously reconciles the lattice back to that number regardless of
# consumer-group lag. ../../k8s/keda/base/kafka-scaledobject.yaml's `kafka`
# ScaledObject reads the SAME lag for visibility/vocabulary but has no
# Deployment to patch (there is none — this is a wasmCloud component, not a
# plain container workload), so it cannot and does not drive this number. A
# verify/capture run that wants to SHOW instances growing under a producer
# burst does so by raising `spreadscaler.properties.instances` here (by hand,
# or by a future automation watching the same lag metric) — NOT by anything
# KEDA does. This is the deliberate asymmetry Decision A calls out.
#
# deploy.sh (author-only, not run in this BUILD pass) rewrites the __*_REF__
# placeholders to the pushed private ghcr component refs, exactly like
# ../../openshift/wadm-filtered.yaml's __PROVIDER_REF__/__FILTER_REF__/
# __FRONTDOOR_REF__ convention. contracts/wit stays pristine — nothing here
# edits an interface.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: cargo-kafka
  annotations:
    version: v0.0.1
    description: "ch23 Kafka message handler (messaging-kafka provider -> kafka-handler component -> cargo provider) on minikube — wadm OWNS the handler replica count, KEDA only OBSERVES lag"
spec:
  components:
    # --- the Part 2 cargo provider (exports patterncatalyst:cargo/*), reused verbatim ---
    - name: cargo-provider-k
      type: component
      properties:
        image: __PROVIDER_REF__
      traits:
        - type: spreadscaler
          properties:
            instances: 1

    # --- the ch23 Kafka message HANDLER (exports wasmcloud:messaging/handler) ---
    - name: kafka-handler
      type: component
      properties:
        image: __HANDLER_REF__
      traits:
        # wadm OWNS this number. Bump it to demonstrate a lag-driven scale-out
        # during a producer burst (../../k8s/kafka/producer-burst.sh); KEDA's
        # ScaledObject reading the same consumer-group lag has no bearing on
        # this value (see the file header).
        - type: spreadscaler
          properties:
            instances: 1
        # kafka-handler's cargo IMPORT -> cargo-provider-k's EXPORT
        - type: link
          properties:
            target: cargo-provider-k
            namespace: patterncatalyst
            package: cargo
            interfaces:
              - handling

    # --- the messaging-kafka capability provider (the Kafka CONSUMER) ---
    - name: messaging-kafka
      type: capability
      properties:
        # Upstream ships NO semver release for this provider — only
        # commit-SHA builds aliased `canary` (confirmed via the ghcr package
        # page 2026-10-21; latest commit-SHA tag at kickoff was 6c67eb2, ~8
        # months old). Pinned to the commit SHA, not the floating `canary`
        # alias, so a re-run never silently picks up a different build.
        # TBD-confirm-at-kickoff: re-check ghcr for a newer commit-SHA tag
        # before the live run.
        image: ghcr.io/wasmcloud/messaging-kafka:6c67eb2
      traits:
        # provider (source, the CONSUMER) -> kafka-handler (target) on
        # wasmcloud:messaging/handler — one call per delivered message.
        - type: link
          properties:
            target: kafka-handler
            namespace: wasmcloud
            package: messaging
            interfaces:
              - handler
            source_config:
              - name: cargo-handling-events-consumer
                properties:
                  # Config key names are NOT documented for messaging-kafka in
                  # current upstream docs at kickoff (no dedicated reference
                  # page was found; messaging-nats's documented shape —
                  # `subscriptions` for a NATS subject — is the closest known
                  # analogue). TBD-confirm-at-kickoff: confirm these keys
                  # against `wash inspect ghcr.io/wasmcloud/messaging-kafka:
                  # 6c67eb2` / the provider's own README before the live run;
                  # correct the key names here if they differ.
                  hosts: cargo-kafka-kafka-bootstrap.kafka.svc:9092
                  topic: cargo-handling-events
                  consumer_group: kafka-handler
