# WasmCloudHostConfig for the ch23 Kafka half on PLAIN minikube — the
# counterpart to ../../openshift/wasmcloud-host.yaml. Same pins, same reasoning
# (host 1.9.1 is the version Part 4/5 proved against the http-server:0.27.0
# provider's wRPC protocol; the chart's default host is too old); no
# restricted-v2 commentary applies here since minikube enforces no SCC-style
# PodSecurity by default.
apiVersion: k8s.wasmcloud.dev/v1alpha1
kind: WasmCloudHostConfig
metadata:
  name: wasmcloud-host
  namespace: wasmcloud
spec:
  hostReplicas: 1
  lattice: default
  version: "1.9.1"
  natsAddress: nats://nats.wasmcloud.svc.cluster.local
  registryCredentialsSecret: ghcr-pull
  allowLatest: false
