# The WIT contract CI gate.
#
# Two jobs:
#
#   1. validate — confirms contracts/wit parses as a valid WIT package
#      (wasm-tools component wit). No toolchain beyond wasm-tools; fast,
#      runs first so a broken contract fails before the heavier job starts.
#
#   2. examples — the full drift + examples gate deferred from r02, now that
#      examples/part2-building-components/ (Rust + Go provider components,
#      Rust + Go consumer components, native host, wac compositions,
#      verify.sh) exists to build and diff. Installs the full pinned
#      toolchain (including wac, for composing provider + consumer), runs
#      verify.sh (which already builds both provider components and both
#      consumer components, regenerating all four sets of bindings from
#      contracts/wit as a side effect of the build — cargo-component
#      updates src/bindings.rs as part of `cargo component build` for both
#      Rust crates, and each Go build's own first step is
#      `wit-bindgen-go generate`), runs the native host against both
#      providers, asserts the two independently-built providers agree
#      byte-for-byte, checks each component's exported WIT against
#      contracts/wit, composes all four provider x consumer combinations
#      with `wac plug`, and runs the recoverable-error + trap assertions
#      against the composed components. The drift check then piggybacks on
#      that same regeneration: if it produced any diff against the
#      committed Rust/Go bindings (providers AND consumers), the committed
#      bindings were stale and the job fails. Folded into one job (not a
#      separate bindings-drift job) so the slow from-source cargo-component
#      build and the rest of the toolchain install only happen once per
#      run.
#
#      r04 extends this same job to also build + run
#      examples/part3-interfaces/ (wasi-http front doors, protobuf-in-Wasm,
#      the tonic gRPC bridge, and wasi-sockets reconnect), which reuses the
#      Part 2 providers by building them with their own recipes and composes
#      Part 3's components on top with `wac plug`. This needs one more
#      pinned tool — `protoc` — for prost-build/tonic-prost-build, and adds
#      the three Part 3 Rust bindings.rs files plus the three Part 3 Go
#      internal/ trees to the same drift gate.
#
#      r05 extends this same job to also build + run the Part 4
#      (examples/part4-runtimes/) BUILDABLE artifacts: ch14's wasmtime-host
#      (build.sh builds the guest component + the native wasmtime-embedding
#      host and runs the host, asserting host-import/fuel/epoch/resource-
#      limiter controls — exits non-zero on failure) and ch15's wasmcloud
#      component (build.sh recomposes the Part 2 provider + Part 3 http-rust
#      front door with `wac plug` into app.wasm — no wash, no lattice). The
#      ch15/ch16 wasmCloud LIVE lattice (wash up, wadm deploy, HTTP traffic,
#      the same-bytes proof against wasmtime serve) is NOT run in CI; it is
#      verified live locally with evidence committed under
#      examples/part4-runtimes/wasmcloud/evidence/. The drift gate is
#      extended by one path: ch14 wasmtime-host's guest/src/bindings.rs
#      (regenerated by cargo-component against its local host-world.wit).
#
#   3. k8s-manifests — r06a's STATIC Kubernetes-manifest gate for
#      examples/part5-kubernetes/k8s/ (base/ + overlays/minikube/: namespace,
#      RuntimeClass, the cargo-http Deployment + Service, Ingress). Renders
#      both the base and the minikube overlay OFFLINE with `kubectl
#      kustomize` and pipes the result through kubeconform -strict — no
#      `apply`, no docker, no minikube/CRC cluster of any kind. The
#      deployable artifact itself (app.wasm, the same wac-plug composition as
#      ch15's wasmCloud component) is already built by the examples job's
#      part4-runtimes/wasmcloud/build.sh step above; this job only validates
#      the K8s YAML shape, it does not rebuild or re-package the module. The
#      actual LIVE minikube run (RuntimeClass scheduling onto the wasmtime
#      containerd shim, HTTP traffic, same-bytes proof) is verified by hand
#      with evidence committed under examples/part5-kubernetes/k8s/evidence/
#      — it is NOT a CI step, same treatment Part 4's wasmCloud lattice gets
#      above.
#
#      r06b extends this same job to cover Part 5's OTHER path — OpenShift —
#      with a matching STATIC check: the two authored
#      examples/part5-kubernetes/openshift/ manifests (wasmcloud-host.yaml, a
#      WasmCloudHostConfig CRD instance the wasmCloud operator reconciles; and
#      wadm.yaml, an OAM core.oam.dev Application) are piped straight through
#      the same pinned kubeconform binary with -ignore-missing-schemas (both
#      are CRD instances with no built-in kubeconform schema, same reasoning
#      as the RuntimeClass/Ingress case above) — no `kubectl kustomize`
#      rendering, since these aren't kustomize-managed. The upstream
#      `oci://ghcr.io/wasmcloud/charts/wasmcloud-platform:0.1.2` Helm chart
#      (installed by deploy.sh with values-crc.yaml) is NOT rendered or
#      validated in CI — an OCI chart pull adds a flaky external network
#      dependency this gate doesn't need to prove the authored YAML is
#      well-formed. Part 5 now has a STATIC gate on both deployment targets:
#      minikube (kustomize render) and OpenShift (raw CRD manifests). The LIVE
#      CRC run (operator install, host + lattice up, wadm deploy, HTTPS Route
#      traffic) is, like the minikube run above, verified by hand with
#      evidence committed under examples/part5-kubernetes/openshift/evidence/
#      - never a CI step.
#
#      r06c extends Part 5 to cover the interposition patterns (sidecar
#      filter, protocol adapter, ambassador). The examples job now also
#      builds the two new small component crates -
#      examples/part5-kubernetes/{sidecar-filter,adapter}/ - which regenerate
#      their own committed src/bindings.rs via cargo-component, same as every
#      other Rust component crate in this job; both paths join the drift
#      gate's ALL_BINDINGS. (The ambassador pattern reuses Part 3's
#      sockets-rust component as-is - no new crate, so nothing new to build
#      or drift-check for it.) The k8s-manifests job adds a STATIC render +
#      kubeconform check for the new
#      examples/part5-kubernetes/k8s/interposed/overlays/minikube kustomize
#      overlay (sidecar-filter + adapter Deployments/Ingresses), and adds the
#      four new OAM Application CRD instances -
#      examples/part5-kubernetes/openshift/wadm-{filtered,adapted,ambassador,
#      ambassador-nogrant}.yaml - to the existing OpenShift kubeconform step.
#      No wac plug, no docker, no wash, no minikube/CRC cluster for any of
#      this - same offline-only treatment as r06a/r06b.
#
# Don't duplicate pages.yml's Jekyll build/deploy logic here, and don't
# duplicate this validation step in pages.yml (see pages.yml's own note on
# this job landing in "a later iteration").
name: contracts

on:
  push:
    branches: [main]      # push to main only; PRs validate via pull_request below
  pull_request:
    branches: [main]      # build on PRs targeting main
  workflow_dispatch:      # allow manual runs from the Actions UI

permissions:
  contents: read

jobs:
  validate:
    name: Validate the WIT contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install wasm-tools (pinned, checksum-verified)
        env:
          WASM_TOOLS_VERSION: "1.262.0"   # no floating tag — pin exact
          WASM_TOOLS_SHA256: "655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65"
        run: |
          set -euo pipefail
          archive="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${archive}"
          echo "${WASM_TOOLS_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 "/tmp/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: wasm-tools component wit (validates the WIT package)
        run: wasm-tools component wit contracts/wit

  examples:
    name: Build + run the examples, check generated bindings for drift
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      RUST_VERSION: "1.99.1"
      CARGO_COMPONENT_VERSION: "0.21.1"
      GO_VERSION: "1.26.9"
      WIT_BINDGEN_GO_VERSION: "v0.7.0"
      TINYGO_VERSION: "0.43.0"
      TINYGO_SHA256: "ca9fc6d055e3889462dea4450a2e42a92242d88b5c362a7ec39bdb563413d78a"
      WASM_TOOLS_VERSION: "1.262.0"
      WASM_TOOLS_SHA256: "655b8df67d54c3ef9b52fc237c4e94bbfbb5f5f43825245cb0940a7002a9ed65"
      WASMTIME_VERSION: "50.0.0"
      WASMTIME_SHA256: "77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff"
      WAC_VERSION: "0.12.0"
      WAC_SHA256: "7cd490edbd452221ef89e6750fc43eacc9b71b1242095eb577cb9a3bf0d3beda"
      PROTOC_VERSION: "36.2"
      PROTOC_SHA256: "121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278"
      EXAMPLE_DIR: "examples/part2-building-components"
      PART3_DIR: "examples/part3-interfaces"
      PART4_DIR: "examples/part4-runtimes"
      PART5_DIR: "examples/part5-kubernetes"
      PART6_DIR: "examples/part6-deviations"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust ${{ env.RUST_VERSION }} (pinned) + wasm32-wasip2 target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          targets: wasm32-wasip2, wasm32-wasip1

      # cargo-component has no prebuilt binary for this version — it must be
      # built from source (`cargo install --locked`), which is the slow part
      # of this job. Cache ~/.cargo (bin + registry + git) plus both example
      # crates' target/ dirs, keyed on the toolchain + example Cargo.lock
      # files, with an OS/toolchain-only prefix as a restore-key fallback so
      # a Cargo.lock bump still reuses the already-built cargo-component
      # binary and most of the crates.io registry cache.
      - name: Cache cargo (registry + cargo-component binary + build artifacts)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.EXAMPLE_DIR }}/rust/target
            ${{ env.EXAMPLE_DIR }}/host/target
          key: cargo-examples-${{ runner.os }}-rust${{ env.RUST_VERSION }}-cc${{ env.CARGO_COMPONENT_VERSION }}-${{ hashFiles(format('{0}/rust/Cargo.lock', env.EXAMPLE_DIR), format('{0}/host/Cargo.lock', env.EXAMPLE_DIR)) }}
          restore-keys: |
            cargo-examples-${{ runner.os }}-rust${{ env.RUST_VERSION }}-cc${{ env.CARGO_COMPONENT_VERSION }}-

      - name: Install cargo-component ${{ env.CARGO_COMPONENT_VERSION }} (from source, --locked)
        run: |
          set -euo pipefail
          if [[ -x "$HOME/.cargo/bin/cargo-component" ]] && \
             "$HOME/.cargo/bin/cargo-component" --version 2>/dev/null | grep -q " ${CARGO_COMPONENT_VERSION}\$"; then
            echo "cargo-component ${CARGO_COMPONENT_VERSION} already present (cache hit)"
          else
            cargo install cargo-component --locked --version "${CARGO_COMPONENT_VERSION}"
          fi
          cargo component --version

      - name: Install Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ env.EXAMPLE_DIR }}/go/go.sum

      - name: Install wit-bindgen-go ${{ env.WIT_BINDGEN_GO_VERSION }}
        run: |
          set -euo pipefail
          go install "go.bytecodealliance.org/cmd/wit-bindgen-go@${WIT_BINDGEN_GO_VERSION}"
          "$(go env GOPATH)/bin/wit-bindgen-go" --version || true

      - name: Install TinyGo ${{ env.TINYGO_VERSION }} (pinned, checksum-verified)
        run: |
          set -euo pipefail
          archive="tinygo${TINYGO_VERSION}.linux-amd64.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/${archive}"
          echo "${TINYGO_SHA256}  /tmp/${archive}" | sha256sum -c -
          mkdir -p "$HOME/.local"
          tar -xzf "/tmp/${archive}" -C "$HOME/.local"
          "$HOME/.local/tinygo/bin/tinygo" version

      - name: Install wasm-tools (pinned, checksum-verified)
        run: |
          set -euo pipefail
          archive="wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/${archive}"
          echo "${WASM_TOOLS_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xzf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 "/tmp/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Install wasmtime (pinned, checksum-verified)
        run: |
          set -euo pipefail
          archive="wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/${archive}"
          echo "${WASMTIME_SHA256}  /tmp/${archive}" | sha256sum -c -
          tar -xJf "/tmp/${archive}" -C /tmp
          sudo install -m 0755 "/tmp/wasmtime-v${WASMTIME_VERSION}-x86_64-linux/wasmtime" /usr/local/bin/wasmtime
          wasmtime --version

      # wac composes the provider + consumer components (wac plug) for the
      # recoverable-error + trap assertions. Prebuilt musl binary, not
      # `cargo install` — avoids another from-source build in an already
      # cargo-component-heavy job.
      - name: Install wac ${{ env.WAC_VERSION }} (pinned, checksum-verified)
        run: |
          set -euo pipefail
          bin="wac-cli-x86_64-unknown-linux-musl"
          curl -fsSL -o "/tmp/${bin}" \
            "https://github.com/bytecodealliance/wac/releases/download/v${WAC_VERSION}/${bin}"
          echo "${WAC_SHA256}  /tmp/${bin}" | sha256sum -c -
          sudo install -m 0755 "/tmp/${bin}" /usr/local/bin/wac
          wac --version

      # protoc is a build-dep for the Part 3 protobuf-in-Wasm components and
      # the tonic gRPC bridge — prost-build / tonic-prost-build both invoke
      # `protoc` from PATH to turn proto/cargo.proto into Rust at build time.
      - name: Install protoc ${{ env.PROTOC_VERSION }} (pinned, checksum-verified)
        run: |
          set -euo pipefail
          archive="protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${archive}"
          echo "${PROTOC_SHA256}  /tmp/${archive}" | sha256sum -c -
          unzip -q -o "/tmp/${archive}" -d /tmp/protoc
          sudo install -m 0755 /tmp/protoc/bin/protoc /usr/local/bin/protoc
          protoc --version

      # verify.sh exports PATH itself (~/.cargo/bin, ~/.local/bin, ~/go/bin,
      # ~/.local/tinygo/bin) — matches exactly where each install step above
      # placed its binary, so no further PATH wiring is needed here. It
      # builds the Rust component (cargo component build --release, which
      # also regenerates rust/src/bindings.rs), builds the Go component
      # (go/build.sh, whose first step regenerates go/internal/cargo via
      # wit-bindgen-go generate), builds the native host, runs the host
      # against both components, diffs their output for byte-identical
      # agreement, and checks each component's exported WIT against
      # contracts/wit.
      - name: Build + run the examples (verify.sh)
        run: ${{ env.EXAMPLE_DIR }}/verify.sh

      # Part 3 (Interfaces: HTTP, gRPC, sockets) reuses the Part 2 provider
      # components by building them from their own recipes (verify.sh does
      # this itself) and composes Part 3's HTTP/proto/sockets components on
      # top with `wac plug`. This also regenerates every Part 3 generated
      # binding (cargo-component's src/bindings.rs for the three Rust
      # components, wit-bindgen-go's internal/ tree for the three Go/TinyGo
      # components) from contracts/wit and http-go/proto-go/sockets-go's own
      # vendored WIT, which the drift gate below then checks.
      - name: Build + run the Part 3 examples (verify.sh)
        run: ${{ env.PART3_DIR }}/verify.sh

      # Part 4 (Runtimes: ch14 wasmtime embedding, ch15 wasmCloud deployable
      # component) covers the two BUILDABLE artifacts for this part. The
      # wasmCloud LIVE lattice (ch15/ch16: wash up, wadm deploy, HTTP traffic,
      # the same-bytes proof against wasmtime serve) is NOT run in CI — it is
      # verified live locally and the evidence is committed under
      # examples/part4-runtimes/wasmcloud/evidence/. CI stays to the pure,
      # no-wash, no-lattice build so a broken build/compose still fails fast.
      #
      # ch14 wasmtime-host: build.sh builds the guest component (regenerating
      # its committed bindings.rs via cargo-component as a side effect, same
      # as the Part 2/3 components), builds the native wasmtime-embedding
      # host, and runs the host against the guest — asserting a host-provided
      # import, fuel exhaustion, epoch interruption, and a ResourceLimiter
      # memory-growth denial. Exits non-zero on any missed assertion.
      - name: Build + run the ch14 wasmtime-host (build.sh)
        run: ${{ env.PART4_DIR }}/wasmtime-host/build.sh

      # ch15 wasmcloud: build.sh rebuilds the Part 2 Rust provider and the
      # Part 3 http-rust front door from their own recipes and composes them
      # with `wac plug` into app.wasm — the exact deployable component
      # wasmCloud (and separately, wasmtime serve) runs. No wash, no lattice;
      # just confirms the composed artifact still builds and validates.
      - name: Build the ch15 wasmCloud component (build.sh)
        run: ${{ env.PART4_DIR }}/wasmcloud/build.sh

      # r06c: the two Part 5 interposition components — sidecar-filter (a
      # wasi-http middleware that composes in front of an upstream component)
      # and adapter (a protocol-shape adapter) — are small cargo-component
      # crates, same recipe as every other Rust component crate in this job.
      # `cargo component build --release` regenerates each crate's committed
      # src/bindings.rs as a side effect, which the drift gate below then
      # checks. No `wac plug`, no docker, no wash, no minikube/CRC — just the
      # component builds, same scope as the rest of this job. (The
      # ambassador pattern reuses Part 3's sockets-rust component unchanged —
      # already built above by Part 3's verify.sh — so there's no new crate
      # to build here for it.)
      - name: Build the Part 5 sidecar-filter component
        run: |
          set -euo pipefail
          cd "${PART5_DIR}/sidecar-filter"
          cargo component build --release

      - name: Build the Part 5 adapter component
        run: |
          set -euo pipefail
          cd "${PART5_DIR}/adapter"
          cargo component build --release

      # r06d: the Part 5 ch23 kafka-handler component — a wasmCloud
      # messaging-kafka handler (local wit exporting wasmcloud:messaging/handler
      # + importing the cargo contract via path-dep, contracts/wit stays
      # pristine), same cargo-component recipe as every other Rust crate here.
      # `cargo component build --release` regenerates its committed
      # src/bindings.rs, which the drift gate below then checks. No wash, no
      # Kafka broker, no cluster — just the component build. The ch23 KEDA/
      # Strimzi/wasmCloud LIVE runs (HTTP add-on scale-to-zero, the kafka
      # consumer-group-lag scaler) are verified by hand with evidence committed
      # under examples/part5-kubernetes/{k8s,openshift}/evidence/ — never CI.
      - name: Build the Part 5 kafka-handler component
        run: |
          set -euo pipefail
          cd "${PART5_DIR}/kafka-handler"
          cargo component build --release

      # r07a: the ch25 Istio filter is a PROXY-WASM core module, NOT a Component
      # Model component — plain `cargo build --target wasm32-wasip1` of a cdylib
      # using the `proxy-wasm` crate, no cargo-component, no WIT, no bindings.rs.
      # It is built here only to prove it still compiles; it is deliberately
      # EXCLUDED from the bindings-drift gate below (it has no generated bindings
      # and never touches contracts/wit). The WasmPlugin LIVE run (Istio on
      # minikube + OSSM3 on CRC) is evidence-only, verified by hand under
      # examples/part6-deviations/istio/evidence/ — never a CI step.
      - name: Build the Part 6 ch25 proxy-wasm Istio filter
        run: |
          set -euo pipefail
          cd "${PART6_DIR}/istio-wasmfilter"
          cargo build --release --target wasm32-wasip1

      # Drift gate: verify.sh (above) already regenerated all four sets of
      # committed generated bindings from contracts/wit as a side effect of
      # building — the two providers (Rust + Go) AND the two consumers
      # (Rust + Go) it now also builds before composing — plus the Part 3
      # verify.sh regenerated the Part 3 Rust bindings.rs files and Go
      # internal/ trees. If any of that regeneration produced any diff —
      # modified lines OR new/removed generated files — the committed
      # bindings are stale relative to the contract and the build fails
      # here.
      #
      # Part 4 adds one more: ch14 wasmtime-host's guest/ is a cargo-component
      # crate against the LOCAL host-world.wit (not contracts/wit), and its
      # build.sh (above) regenerates guest/src/bindings.rs the same way the
      # Part 2/3 Rust crates do. ch15 wasmcloud's build.sh only recomposes
      # already-built Part 2/3 components with `wac plug` — it does not
      # generate any bindings of its own, so nothing new to add there.
      #
      # r06c adds two more: the Part 5 sidecar-filter and adapter crates built
      # above each regenerate their own committed src/bindings.rs the same
      # way every other cargo-component crate in this job does. The
      # ambassador pattern has no new crate (it reuses Part 3's sockets-rust
      # as-is, already covered by PART3_SOCKETS_RUST_BINDINGS above), so
      # nothing new to add there.
      - name: Check committed generated bindings are not stale (drift gate)
        run: |
          set -euo pipefail
          GO_BINDINGS="${EXAMPLE_DIR}/go/internal/cargo"
          RUST_BINDINGS="${EXAMPLE_DIR}/rust/src/bindings.rs"
          CONSUMER_GO_BINDINGS="${EXAMPLE_DIR}/consumer-go/internal"
          CONSUMER_RUST_BINDINGS="${EXAMPLE_DIR}/consumer-rust/src/bindings.rs"
          PART3_HTTP_RUST_BINDINGS="${PART3_DIR}/http-rust/src/bindings.rs"
          PART3_HTTP_GO_BINDINGS="${PART3_DIR}/http-go/internal"
          PART3_PROTO_RUST_BINDINGS="${PART3_DIR}/proto-component/proto-rust/src/bindings.rs"
          PART3_PROTO_GO_BINDINGS="${PART3_DIR}/proto-go/internal"
          PART3_SOCKETS_RUST_BINDINGS="${PART3_DIR}/sockets-rust/src/bindings.rs"
          PART3_SOCKETS_GO_BINDINGS="${PART3_DIR}/sockets-go/internal"
          PART4_WASMTIME_HOST_GUEST_BINDINGS="${PART4_DIR}/wasmtime-host/guest/src/bindings.rs"
          PART5_SIDECAR_FILTER_BINDINGS="${PART5_DIR}/sidecar-filter/src/bindings.rs"
          PART5_ADAPTER_BINDINGS="${PART5_DIR}/adapter/src/bindings.rs"
          PART5_KAFKA_HANDLER_BINDINGS="${PART5_DIR}/kafka-handler/src/bindings.rs"
          ALL_BINDINGS=(
            "$GO_BINDINGS" "$RUST_BINDINGS" "$CONSUMER_GO_BINDINGS" "$CONSUMER_RUST_BINDINGS"
            "$PART3_HTTP_RUST_BINDINGS" "$PART3_HTTP_GO_BINDINGS"
            "$PART3_PROTO_RUST_BINDINGS" "$PART3_PROTO_GO_BINDINGS"
            "$PART3_SOCKETS_RUST_BINDINGS" "$PART3_SOCKETS_GO_BINDINGS"
            "$PART4_WASMTIME_HOST_GUEST_BINDINGS"
            "$PART5_SIDECAR_FILTER_BINDINGS" "$PART5_ADAPTER_BINDINGS"
            "$PART5_KAFKA_HANDLER_BINDINGS"
          )
          CHANGED="$(git status --porcelain -- "${ALL_BINDINGS[@]}")"
          if [[ -n "$CHANGED" ]]; then
            echo "::error::Committed generated bindings are stale relative to contracts/wit:"
            echo "$CHANGED"
            git --no-pager diff -- "${ALL_BINDINGS[@]}" || true
            exit 1
          fi
          echo "ok — committed bindings match a fresh regeneration from contracts/wit:"
          printf '  %s\n' "${ALL_BINDINGS[@]}"

  k8s-manifests:
    # Static Kubernetes-manifest validation for Part 5 — renders
    # examples/part5-kubernetes/k8s/{base,overlays/minikube} OFFLINE
    # (kustomize templating only, no `apply`) and runs the result through
    # kubeconform. This does NOT stand up minikube or any cluster and must
    # never call verify-minikube.sh; that stays a live-cluster-only check run
    # by hand, with evidence committed under
    # examples/part5-kubernetes/k8s/evidence/ (Headless Cluster Verification
    # convention). `-ignore-missing-schemas` covers the CRD-less-but-still-
    # obscure kinds here — node.k8s.io RuntimeClass and networking.k8s.io
    # Ingress — so the job doesn't red-fail on manifests that are otherwise
    # valid just because kubeconform's bundled schema set doesn't carry them.
    # Modeled on the WebSockets sibling site's k8s-manifests job
    # (../../api-patterns-and-practices-websockets/.github/workflows/contracts.yml).
    #
    # r06b: this job now covers BOTH of Part 5's deployment targets, still
    # fully offline — minikube (kustomize render above) AND OpenShift (the
    # two authored examples/part5-kubernetes/openshift/ CRD-instance
    # manifests, validated as-committed with no templating step, below). Both
    # targets' LIVE cluster runs are evidence-only, verified by hand and
    # committed under each target's own evidence/ directory — never a CI
    # step.
    #
    # r06c adds the interposition patterns' manifests to both existing
    # checks, still fully offline: the new
    # examples/part5-kubernetes/k8s/interposed/overlays/minikube kustomize
    # overlay (sidecar-filter + adapter Deployments/Ingresses) joins the
    # minikube render below, and the four new OAM Application CRD instances —
    # openshift/wadm-{filtered,adapted,ambassador,ambassador-nogrant}.yaml —
    # join the existing OpenShift kubeconform step. No new tooling; same
    # pinned kubeconform + kubectl kustomize as above.
    name: Validate Part 5 Kubernetes manifests (kustomize render, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install kubeconform (pinned, checksum-verified)
        env:
          KUBECONFORM_VERSION: v0.8.0   # no floating tag — pin exact
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Install kubectl (pinned; also provides `kubectl kustomize`)
        uses: azure/setup-kubectl@v5
        with:
          version: v1.37.1   # no floating tag; kustomize v5.8.1 bundled, no standalone binary needed

      - name: Show kubectl version
        run: kubectl version --client

      - name: Validate Part 5 Kubernetes manifests (kubeconform) — base
        run: |
          kubectl kustomize examples/part5-kubernetes/k8s/base \
            | kubeconform -strict -kubernetes-version 1.37.1 -ignore-missing-schemas -summary -

      - name: Validate Part 5 Kubernetes manifests (kubeconform) — minikube overlay
        run: |
          kubectl kustomize examples/part5-kubernetes/k8s/overlays/minikube \
            | kubeconform -strict -kubernetes-version 1.37.1 -ignore-missing-schemas -summary -

      # r06c: the interposition patterns' minikube overlay (sidecar-filter +
      # adapter Deployments/Ingresses) — same offline kustomize render +
      # kubeconform treatment as the base/minikube overlay above.
      - name: Validate Part 5 Kubernetes manifests (kubeconform) — interposed minikube overlay
        run: |
          kubectl kustomize examples/part5-kubernetes/k8s/interposed/overlays/minikube \
            | kubeconform -strict -kubernetes-version 1.37.1 -ignore-missing-schemas -summary -

      # r06d (ch22 HPA / ch23 KEDA scale-to-zero / ch24 observability) — each
      # new minikube kustomize overlay rendered offline + kubeconform, same
      # treatment as the base/minikube/interposed overlays above. scaling =
      # the autoscaling/v2 HPA + load generator on the raw-shim Deployment;
      # keda = the KEDA HTTP add-on HTTPScaledObject + interceptor Service +
      # the Ingress rewire; kafka = the Strimzi Kafka/KafkaNodePool/KafkaTopic
      # CRs (CRD kinds -> skipped by -ignore-missing-schemas); observability =
      # the grafana/otel-lgtm Deployment+Service. No cluster — the LIVE runs
      # (HPA climb, scale-to-zero cold start, Kafka-lag scaling, OTel queries)
      # are evidence-only under examples/part5-kubernetes/k8s/evidence/.
      - name: Validate Part 5 Kubernetes manifests (kubeconform) — r06d minikube overlays
        run: |
          for overlay in \
            examples/part5-kubernetes/k8s/scaling/overlays/minikube \
            examples/part5-kubernetes/k8s/keda/overlays/minikube \
            examples/part5-kubernetes/k8s/observability/overlays/minikube \
            examples/part5-kubernetes/k8s/kafka/base; do
            echo "== kustomize render: ${overlay} =="
            kubectl kustomize "${overlay}" \
              | kubeconform -strict -kubernetes-version 1.37.1 -ignore-missing-schemas -summary -
          done

      # r06d standalone CRD-instance manifests not under a kustomization: the
      # KEDA kafka ScaledObject (kept out of the keda/base kustomize so the
      # HTTP overlay renders without it), and the minikube wasmCloud CRD
      # instances (WasmCloudHostConfig + the wadm-kafka OAM Application for the
      # ch23 Kafka half that runs on wasmCloud-on-minikube). All CRD kinds with
      # no bundled schema -> skipped by -ignore-missing-schemas, same as the
      # OpenShift wadm manifests below; this only checks YAML well-formedness.
      - name: Validate Part 5 Kubernetes manifests (kubeconform) — r06d standalone CRD instances
        run: |
          kubeconform -strict -kubernetes-version 1.37.1 -ignore-missing-schemas -summary \
            examples/part5-kubernetes/k8s/keda/base/kafka-scaledobject.yaml \
            examples/part5-kubernetes/k8s/wasmcloud/wasmcloud-host.yaml \
            examples/part5-kubernetes/k8s/wasmcloud/wadm-kafka.yaml

      # OpenShift path (r06b): these two files are hand-authored CRD
      # instances, not kustomize-managed, so they're validated as-committed —
      # no `kubectl kustomize` render step. Both kinds (WasmCloudHostConfig
      # from the wasmCloud operator, core.oam.dev Application from wadm) are
      # CRDs with no built-in kubeconform schema, hence -ignore-missing-
      # schemas, same as the RuntimeClass/Ingress kinds above. This only
      # checks the YAML is well-formed and schema-shaped; it does not install
      # the operator, the chart, or reach any cluster.
      #
      # r06c adds the four interposition-pattern OAM Application CRD
      # instances (wadm-filtered, wadm-adapted, wadm-ambassador,
      # wadm-ambassador-nogrant) to this same step — same CRD kind as wadm.yaml
      # above, same -ignore-missing-schemas reasoning, still no cluster.
      # r06d adds four more OpenShift manifests to this step: wadm-scaled (the
      # ch22 spreadscaler-instances OAM variant), wadm-kafka (the ch23 Kafka
      # handler + messaging-kafka provider OAM Application), wasmcloud-host-otel
      # (the ch24 WasmCloudHostConfig variant enabling host OTLP) — all CRD
      # instances, skipped-schema like the others — plus otel-collector.yaml,
      # the ch24 minimal rootless OTel Collector (ConfigMap + Deployment +
      # Service, restricted-v2, NO SCC exception), whose native kinds ARE
      # schema-validated here. Same offline, no-cluster treatment.
      - name: Validate Part 5 OpenShift manifests (kubeconform) — wasmCloudHostConfig + wadm Applications
        run: |
          kubeconform -strict -kubernetes-version 1.37.1 -ignore-missing-schemas -summary \
            examples/part5-kubernetes/openshift/wasmcloud-host.yaml \
            examples/part5-kubernetes/openshift/wadm.yaml \
            examples/part5-kubernetes/openshift/wadm-filtered.yaml \
            examples/part5-kubernetes/openshift/wadm-adapted.yaml \
            examples/part5-kubernetes/openshift/wadm-ambassador.yaml \
            examples/part5-kubernetes/openshift/wadm-ambassador-nogrant.yaml \
            examples/part5-kubernetes/openshift/wadm-scaled.yaml \
            examples/part5-kubernetes/openshift/wadm-kafka.yaml \
            examples/part5-kubernetes/openshift/wasmcloud-host-otel.yaml \
            examples/part5-kubernetes/openshift/otel-collector.yaml

      # r07a (ch25 Istio + Wasm) — the proxy-wasm WasmPlugin deployment manifests,
      # still fully offline: render the minikube overlay (reuses the Part 5
      # cargo-http base + the Istio Gateway/VirtualService/WasmPlugin) through
      # kustomize + kubeconform, and validate the standalone CRC/OSSM3 CRD
      # instances as-committed. WasmPlugin (extensions.istio.io), Gateway/
      # VirtualService (networking.istio.io), Istio/IstioCNI (sailoperator.io)
      # and the edge-TLS Route are all CRDs with no bundled schema -> skipped by
      # -ignore-missing-schemas, same reasoning as the wadm/WasmCloudHostConfig
      # manifests above. The LIVE mesh runs (Istio on minikube, OSSM3 on CRC)
      # are evidence-only under examples/part6-deviations/istio/evidence/.
      - name: Validate Part 6 ch25 Istio manifests (kubeconform) — minikube overlay + CRC CRD instances
        run: |
          kubectl kustomize examples/part6-deviations/istio/overlays/minikube \
            | kubeconform -strict -kubernetes-version 1.37.1 -ignore-missing-schemas -summary -
          kubeconform -strict -kubernetes-version 1.37.1 -ignore-missing-schemas -summary \
            examples/part6-deviations/istio/openshift/wasmplugin.yaml \
            examples/part6-deviations/istio/openshift/gateway.yaml \
            examples/part6-deviations/istio/openshift/virtualservice.yaml \
            examples/part6-deviations/istio/openshift/route.yaml
