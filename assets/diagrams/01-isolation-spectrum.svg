<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="16" width="900" height="130" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="36" font-size="12" font-weight="700" fill="#1d1d1d">Virtual machine: hardware-virtualized, own kernel</text>
<rect x="20" y="164" width="900" height="130" rx="12" fill="#fff3e0" stroke="#ddd"/>
<text x="32" y="184" font-size="12" font-weight="700" fill="#1d1d1d">Container: shared host kernel, namespace + cgroup isolation</text>
<rect x="20" y="312" width="900" height="132" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="332" font-size="12" font-weight="700" fill="#1d1d1d">Wasm component: sandboxed by the runtime, no syscalls by default</text>
<rect x="50" y="50" width="220" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="160.0" y="88.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Guest kernel + OS</text>
<text x="160.0" y="105.0" font-size="11.5" fill="#555555" text-anchor="middle">full hardware emulation</text>
<rect x="330" y="50" width="200" height="80" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="430.0" y="88.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Image: GBs</text>
<text x="430.0" y="105.0" font-size="11.5" fill="#555555" text-anchor="middle">Cold start: seconds</text>
<rect x="590" y="50" width="300" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="740.0" y="88.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Isolation: hardware (hypervisor)</text>
<text x="740.0" y="105.0" font-size="11.5" fill="#555555" text-anchor="middle">Strongest, heaviest</text>
<rect x="50" y="198" width="220" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="160.0" y="236.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Shared host kernel</text>
<text x="160.0" y="253.0" font-size="11.5" fill="#555555" text-anchor="middle">namespaces + cgroups</text>
<rect x="330" y="198" width="200" height="80" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="430.0" y="236.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Image: tens of MBs</text>
<text x="430.0" y="253.0" font-size="11.5" fill="#555555" text-anchor="middle">Cold start: ~100s of ms</text>
<rect x="590" y="198" width="300" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="740.0" y="236.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Isolation: kernel boundary</text>
<text x="740.0" y="253.0" font-size="11.5" fill="#555555" text-anchor="middle">Shared attack surface with host</text>
<rect x="50" y="346" width="220" height="84" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="160.0" y="386.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">wasmtime / wasmCloud</text>
<text x="160.0" y="403.0" font-size="11.5" fill="#555555" text-anchor="middle">capability-based sandbox</text>
<rect x="330" y="346" width="200" height="84" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="430.0" y="386.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Image: single-digit MBs</text>
<text x="430.0" y="403.0" font-size="11.5" fill="#555555" text-anchor="middle">Cold start: single-digit ms</text>
<rect x="590" y="346" width="300" height="84" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="740.0" y="386.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Isolation: no ambient syscalls</text>
<text x="740.0" y="403.0" font-size="11.5" fill="#555555" text-anchor="middle">deny-by-default, host grants capabilities</text>
<text x="470" y="440" font-size="12" fill="#555555" text-anchor="middle">Lower = lighter weight, faster to start, narrower default capability surface.</text>
</svg>