<rect x="20" y="16" width="1060" height="340" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="36" font-size="12" font-weight="700" fill="#1d1d1d">examples/part2-building-components/ — repeat this loop per language, then run verify.sh for both</text>
<rect x="50" y="70" width="230" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="165.0" y="100.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. build</text>
<text x="165.0" y="117.5" font-size="11.5" fill="#555555" text-anchor="middle">cargo component build --release</text>
<text x="165.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">./go/build.sh (TinyGo)</text>
<rect x="320" y="70" width="230" height="80" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="435.0" y="108.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">2. inspect</text>
<text x="435.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">wasm-tools component wit &lt;file&gt;.wasm</text>
<rect x="590" y="70" width="230" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="705.0" y="108.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">3. run</text>
<text x="705.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">cargo-host &lt;wasm&gt; scenario.json &lt;lang&gt;</text>
<rect x="860" y="70" width="190" height="80" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="955.0" y="108.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">4. verify</text>
<text x="955.0" y="125.0" font-size="11.5" fill="#555555" text-anchor="middle">./verify.sh</text>
<rect x="320" y="200" width="460" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="550.0" y="233.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">verify.sh diffs Rust output vs Go output</text>
<text x="550.0" y="250.0" font-size="11.5" fill="#555555" text-anchor="middle">and checks exported interfaces against contracts/wit</text>
<rect x="200" y="310" width="700" height="40" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="550.0" y="335.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">5. teardown — cargo clean; rm core.wasm embedded.wasm cargo-go.wasm (see .gitignore)</text>
