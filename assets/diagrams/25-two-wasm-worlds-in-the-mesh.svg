<rect x="80" y="510" width="1020" height="140" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="590.0" y="578.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">A runtimeClassName: wasmtime pod runs one container runtime, so the mesh filter runs in the gateway&#x27;s Envoy, not a sidecar.</text>
<text x="590.0" y="595.0" font-size="11.5" fill="#555555" text-anchor="middle">Two Wasm ABIs across the mesh: proxy-wasm core module (gateway Envoy) and Component Model (app pod).</text>
