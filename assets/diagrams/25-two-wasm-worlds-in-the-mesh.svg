<text x="300.0" y="328.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">proxy-wasm filter: cargo-wasmfilter</text>
<text x="300.0" y="345.0" font-size="11.5" fill="#555555" text-anchor="middle">core-module ABI (proxy-wasm crate, plain cargo)</text>
