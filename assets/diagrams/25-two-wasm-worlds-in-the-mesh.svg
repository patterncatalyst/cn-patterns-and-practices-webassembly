<text x="880.0" y="298.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">cargo-http Pod</text>
<text x="880.0" y="315.0" font-size="11.5" fill="#555555" text-anchor="middle">Part 5 Wasm substrate, unchanged</text>
