<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 540" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="20" width="1000" height="70" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="520.0" y="53.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">guest wasi-otel is RC-only: NOT used in this book</text>
<text x="520.0" y="70.0" font-size="11.5" fill="#555555" text-anchor="middle">telemetry here is substrate-provided, not component-authored</text>
<rect x="20" y="110" width="300" height="50" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="170.0" y="140.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">signal</text>
<rect x="340" y="110" width="330" height="50" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="505.0" y="140.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">minikube: shim-level (containerd-shim-wasmtime)</text>
<rect x="690" y="110" width="330" height="50" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="855.0" y="140.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">CRC: host-level (wasmCloud host 1.9.1)</text>
<rect x="20" y="180" width="300" height="80" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="170.0" y="225.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">traces</text>
<rect x="340" y="180" width="330" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="505.0" y="218.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">span per invocation,</text>
<text x="505.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">emitted by the shim, not the guest</text>
<rect x="690" y="180" width="330" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="855.0" y="218.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">host + provider spans,</text>
<text x="855.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">wRPC call boundaries captured natively</text>
<rect x="20" y="280" width="300" height="80" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="170.0" y="325.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">metrics</text>
<rect x="340" y="280" width="330" height="80" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="505.0" y="318.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">not emitted by the shim:</text>
<text x="505.0" y="335.0" font-size="11.5" fill="#555555" text-anchor="middle">cgroup CPU only, via metrics-server</text>
<rect x="690" y="280" width="330" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="855.0" y="318.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">host-native metrics,</text>
<text x="855.0" y="335.0" font-size="11.5" fill="#555555" text-anchor="middle">instance counts, invocation rates</text>
<rect x="20" y="380" width="300" height="80" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="170.0" y="425.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">logs</text>
<rect x="340" y="380" width="330" height="80" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="505.0" y="418.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">container stdout/stderr only,</text>
<text x="505.0" y="435.0" font-size="11.5" fill="#555555" text-anchor="middle">kubelet-captured, not OTel</text>
<rect x="690" y="380" width="330" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="855.0" y="418.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">host-native structured logs,</text>
<text x="855.0" y="435.0" font-size="11.5" fill="#555555" text-anchor="middle">via the OTel log pipeline</text>
<text x="520" y="500" font-size="12" fill="#555555" text-anchor="middle">Check whether a signal is shim-emitted, host-emitted, or absent before trusting a chapter&#x27;s &quot;OTel on Wasm&quot; claim.</text>
</svg>