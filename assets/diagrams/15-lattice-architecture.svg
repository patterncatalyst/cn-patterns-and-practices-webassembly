<text x="590" y="630" font-size="12" fill="#555555" text-anchor="middle">One `wash up -d` starts NATS + wadm + the host; `wash app deploy wadm.yaml` starts the provider + component and establishes the link.</text>
<text x="590" y="648" font-size="12" fill="#555555" text-anchor="middle">The provider owns the socket; the component only ever sees a WIT call. It never parses raw HTTP.</text>
