<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="40" width="1140" height="230" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="60" font-size="12" font-weight="700" fill="#1d1d1d">minikube: compile-time composition (wac plug): ONE Pod, ONE component instance</text>
<rect x="20" y="320" width="1140" height="280" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="340" font-size="12" font-weight="700" fill="#1d1d1d">CRC: runtime-link composition (wadm links): THREE components, THREE independent lifecycles</text>
<rect x="60" y="90" width="230" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="175.0" y="123.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Part 2 provider</text>
<text x="175.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">exports patterncatalyst:cargo/*</text>
<rect x="330" y="90" width="230" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="445.0" y="115.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">sidecar-filter</text>
<text x="445.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">imports+exports cargo</text>
<text x="445.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">embargo + log</text>
<rect x="600" y="90" width="230" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="715.0" y="123.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Part 3 http-rust</text>
<text x="715.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">imports cargo, exports wasi:http</text>
<rect x="870" y="90" width="260" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="1000.0" y="115.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">app-filtered.wasm</text>
<text x="1000.0" y="132.5" font-size="11.5" fill="#555555" text-anchor="middle">wac plug x2, ONE Pod</text>
<text x="1000.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">containerd wasmtime shim</text>
<rect x="330" y="190" width="500" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="580.0" y="218.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">one in-process instance serves book-cargo AND get-cargo</text>
<text x="580.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">for a single HTTP request: HashMap state is shared</text>
<rect x="60" y="370" width="220" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="170.0" y="395.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">cargo-provider-f</text>
<text x="170.0" y="412.5" font-size="11.5" fill="#555555" text-anchor="middle">component (fresh instance</text>
<text x="170.0" y="427.5" font-size="11.5" fill="#555555" text-anchor="middle">per invocation)</text>
<rect x="330" y="370" width="220" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="440.0" y="395.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">cargo-filter</text>
<text x="440.0" y="412.5" font-size="11.5" fill="#555555" text-anchor="middle">interposer component</text>
<text x="440.0" y="427.5" font-size="11.5" fill="#555555" text-anchor="middle">(fresh instance per call)</text>
<rect x="600" y="370" width="220" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="710.0" y="395.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">cargo-filtered</text>
<text x="710.0" y="412.5" font-size="11.5" fill="#555555" text-anchor="middle">front door component</text>
<text x="710.0" y="427.5" font-size="11.5" fill="#555555" text-anchor="middle">(fresh instance per call)</text>
<rect x="870" y="370" width="260" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="1000.0" y="395.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">httpserver provider 0.27.0</text>
<text x="1000.0" y="412.5" font-size="11.5" fill="#555555" text-anchor="middle">wadm link traits over wRPC</text>
<text x="1000.0" y="427.5" font-size="11.5" fill="#555555" text-anchor="middle">edge-TLS Route, CA-verified</text>
<rect x="60" y="470" width="500" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="310.0" y="505.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">book-cargo and get-cargo are TWO separate wRPC calls</text>
<text x="310.0" y="522.5" font-size="11.5" fill="#555555" text-anchor="middle">each gets a fresh instance + reset linear memory;</text>
<text x="310.0" y="537.5" font-size="11.5" fill="#555555" text-anchor="middle">the provider&#x27;s in-memory HashMap does not survive the link</text>
