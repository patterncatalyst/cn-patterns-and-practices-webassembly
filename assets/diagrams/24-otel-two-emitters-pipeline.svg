<path d="M930,340 L990,340" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="590" y="440" font-size="12" fill="#555555" text-anchor="middle">Two separate clusters, two separate backends: don&#x27;t assume one chapter&#x27;s OTel pipeline describes the other substrate.</text>
