<text x="540" y="40" font-size="13" fill="#1d1d1d" text-anchor="middle" font-weight="700">INSIDE THE WASM SANDBOX — no network, no gRPC transport, just bytes in and bytes out</text>
<text x="540" y="495" font-size="12" fill="#555555" text-anchor="middle">Protobuf is varints, length-delimited fields, fixed64 doubles — pure computation, so it runs in a component with no transport capability at all.</text>
