<rect x="660" y="380" width="440" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="880.0" y="420.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Service: cargo-spin</text>
