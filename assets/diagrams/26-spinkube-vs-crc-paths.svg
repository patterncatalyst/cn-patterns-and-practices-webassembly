<text x="300.0" y="605.0" font-size="11.5" fill="#555555" text-anchor="middle">under spin-operator</text>
<rect x="660" y="170" width="440" height="60" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
