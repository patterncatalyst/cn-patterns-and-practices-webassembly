<text x="880.0" y="565.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Deployment pod</text>
<text x="880.0" y="582.5" font-size="11.5" fill="#555555" text-anchor="middle">ordinary container, no shim/operator/CRD</text>
<text x="880.0" y="597.5" font-size="11.5" fill="#555555" text-anchor="middle">spin up — Spin CLI 4.2.4</text>
<rect x="20" y="720" width="1140" height="140" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="590.0" y="788.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Same Spin app, same wasi:http/handler@0.3.0 export — the host differs, not the app.</text>
<text x="590.0" y="805.0" font-size="11.5" fill="#555555" text-anchor="middle">containerd-shim-spin needs a privileged node install; restricted-v2 does not allow it, so CRC runs the Spin CLI in an ordinary container instead.</text>
