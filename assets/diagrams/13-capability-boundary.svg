<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="16" width="540" height="560" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="36" font-size="12" font-weight="700" fill="#1d1d1d">wasmtime run  (no grant)</text>
<rect x="600" y="16" width="560" height="560" rx="12" fill="#fff3e0" stroke="#ddd"/>
<text x="612" y="36" font-size="12" font-weight="700" fill="#1d1d1d">wasmtime run -S inherit-network  (granted)</text>
<rect x="50" y="56" width="480" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="290.0" y="89.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">component: create-tcp-socket + start-connect</text>
<rect x="50" y="128" width="480" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="290.0" y="154.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">wasi:sockets import resolves to NOTHING</text>
<text x="290.0" y="171.0" font-size="11.5" fill="#555555" text-anchor="middle">the host linked for this instance</text>
<rect x="50" y="200" width="480" height="64" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="290.0" y="230.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">connect denied AT THE BOUNDARY —</text>
<text x="290.0" y="247.0" font-size="11.5" fill="#555555" text-anchor="middle">ErrorCode::AccessDenied, before any packet</text>
<rect x="50" y="284" width="480" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="290.0" y="310.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">component exits non-zero;</text>
<text x="290.0" y="327.0" font-size="11.5" fill="#555555" text-anchor="middle">retrying would not help</text>
<rect x="50" y="400" width="480" height="72" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="290.0" y="434.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">no line to the OS socket layer at all —</text>
<text x="290.0" y="451.0" font-size="11.5" fill="#555555" text-anchor="middle">there is nothing to retry past</text>
<rect x="630" y="56" width="500" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="880.0" y="89.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">component: create-tcp-socket + start-connect</text>
<rect x="630" y="128" width="500" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="880.0" y="154.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">wasi:sockets import resolves to a REAL</text>
<text x="880.0" y="171.0" font-size="11.5" fill="#555555" text-anchor="middle">OS TCP socket the host granted</text>
<rect x="630" y="200" width="500" height="64" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="880.0" y="230.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">connect REACHES 127.0.0.1:port —</text>
<text x="880.0" y="247.0" font-size="11.5" fill="#555555" text-anchor="middle">refused while no listener is bound yet</text>
<rect x="630" y="284" width="500" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="880.0" y="310.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">component backs off and retries</text>
<text x="880.0" y="327.0" font-size="11.5" fill="#555555" text-anchor="middle">(see Figure 13.2)</text>
<rect x="630" y="400" width="500" height="72" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="880.0" y="434.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">once a listener appears, the SAME</text>
<text x="880.0" y="451.0" font-size="11.5" fill="#555555" text-anchor="middle">retry loop connects and returns</text>
<path d="M290,112 L290,128" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M290,184 L290,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M290,264 L290,284" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M290,340 L290,400" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M880,112 L880,128" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M880,184 L880,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M880,264 L880,284" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M880,340 L880,400" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="590" y="600" font-size="12" fill="#555555" text-anchor="middle">Contrast with Chapter 2: a container starts with the host&#x27;s network stack by default and loses it only by subtraction (namespaces, egress policy).</text>
<text x="590" y="620" font-size="12" fill="#555555" text-anchor="middle">A component starts with none and gains exactly what -S inherit-network hands it — no grant, no socket, no exception.</text>
</svg>