<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 830" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="40" width="1140" height="580" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="60" font-size="12" font-weight="700" fill="#1d1d1d">Server-side Wasm backends: compare by operations model, app model, and cluster support</text>
<rect x="20" y="60" width="170" height="70" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="105.0" y="100.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">compare by:</text>
<rect x="20" y="150" width="170" height="140" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="105.0" y="225.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Operations model</text>
<rect x="20" y="310" width="170" height="150" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="105.0" y="390.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">App model</text>
<rect x="20" y="480" width="170" height="140" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="105.0" y="555.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Runs on</text>
<rect x="204" y="60" width="228" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="318.0" y="93.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">raw containerd shim</text>
<text x="318.0" y="110.0" font-size="11.5" fill="#555555" text-anchor="middle">(ch17–ch18)</text>
<rect x="204" y="150" width="228" height="140" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="318.0" y="218.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">none</text>
<text x="318.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">RuntimeClass + shim, no control plane</text>
<rect x="204" y="310" width="228" height="150" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="318.0" y="383.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">any wasi:http component</text>
<text x="318.0" y="400.0" font-size="11.5" fill="#555555" text-anchor="middle">pod-native Wasm</text>
<rect x="204" y="480" width="228" height="140" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="318.0" y="548.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">minikube</text>
<text x="318.0" y="565.0" font-size="11.5" fill="#555555" text-anchor="middle">CRC</text>
<rect x="446" y="60" width="228" height="70" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="560.0" y="93.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">wasmCloud</text>
<text x="560.0" y="110.0" font-size="11.5" fill="#555555" text-anchor="middle">(ch15, ch19)</text>
<rect x="446" y="150" width="228" height="140" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="560.0" y="218.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">operator + lattice</text>
<text x="560.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">wadm links, capability providers</text>
<rect x="446" y="310" width="228" height="150" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="560.0" y="383.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">capability-provider components</text>
<text x="560.0" y="400.0" font-size="11.5" fill="#555555" text-anchor="middle">lattice-addressed, not pod-native</text>
<rect x="446" y="480" width="228" height="140" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="560.0" y="548.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">minikube</text>
<text x="560.0" y="565.0" font-size="11.5" fill="#555555" text-anchor="middle">CRC</text>
<rect x="688" y="60" width="228" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="802.0" y="93.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">SpinKube / Spin</text>
<text x="802.0" y="110.0" font-size="11.5" fill="#555555" text-anchor="middle">(ch26)</text>
<rect x="688" y="150" width="228" height="140" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="802.0" y="218.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">operator + shim</text>
<text x="802.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">spin-operator + containerd-shim-spin</text>
<rect x="688" y="310" width="228" height="150" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="802.0" y="383.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Spin SDK app</text>
<text x="802.0" y="400.0" font-size="11.5" fill="#555555" text-anchor="middle">SpinApp CRD + triggers</text>
<rect x="688" y="480" width="228" height="140" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="802.0" y="548.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">minikube (full SpinKube)</text>
<text x="802.0" y="565.0" font-size="11.5" fill="#555555" text-anchor="middle">CRC (spin up in container)</text>
<rect x="930" y="60" width="228" height="70" rx="9" fill="#f4f4f4" stroke="#6a6e73" stroke-width="1.5"/>
<text x="1044.0" y="100.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">WasmEdge / other runwasi shims</text>
<rect x="930" y="150" width="228" height="140" rx="9" fill="#f4f4f4" stroke="#6a6e73" stroke-width="1.5"/>
<text x="1044.0" y="218.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">operator + shim</text>
<text x="1044.0" y="235.0" font-size="11.5" fill="#555555" text-anchor="middle">same RuntimeClass model, different shim</text>
<rect x="930" y="310" width="228" height="150" rx="9" fill="#f4f4f4" stroke="#6a6e73" stroke-width="1.5"/>
<text x="1044.0" y="383.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">any wasi:http component</text>
<text x="1044.0" y="400.0" font-size="11.5" fill="#555555" text-anchor="middle">runwasi shim, same ABI model</text>
<rect x="930" y="480" width="228" height="140" rx="9" fill="#f4f4f4" stroke="#6a6e73" stroke-width="1.5"/>
<text x="1044.0" y="548.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">runwasi shim model</text>
<text x="1044.0" y="565.0" font-size="11.5" fill="#555555" text-anchor="middle">reference only, not run here</text>
<rect x="20" y="650" width="1140" height="140" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="590.0" y="718.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Four backend options for server-side Wasm: a decision aid, not a ranking.</text>
<text x="590.0" y="735.0" font-size="11.5" fill="#555555" text-anchor="middle">Pick by operations model and app model: SpinKube trades portability for built-in HTTP/Redis/key-value triggers.</text>
<text x="590" y="812" font-size="12" fill="#555555" text-anchor="middle">WasmEdge / other runwasi shims shown for completeness; not exercised as a runnable example in this book.</text>
</svg>