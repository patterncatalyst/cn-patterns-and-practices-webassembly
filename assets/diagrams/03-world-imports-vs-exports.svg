<path d="M380,245 L440,245" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="416.0" y="239.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">same shape, opposite direction</text>
<text x="416.0" y="239.0" font-size="11" fill="#555" text-anchor="middle">same shape, opposite direction</text>
<text x="410" y="355" font-size="12" fill="#b8650a" text-anchor="middle" font-weight="700">A world names no new types — it only declares which direction each interface faces.</text>
