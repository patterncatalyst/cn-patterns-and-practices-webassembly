<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="260" y="15" width="300" height="95" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="410.0" y="53.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">the three interfaces</text>
<text x="410.0" y="70.0" font-size="11.5" fill="#555555" text-anchor="middle">types · booking · handling</text>
<text x="410.0" y="85.0" font-size="11.5" fill="#555555" text-anchor="middle">identical on both sides</text>
<rect x="60" y="180" width="320" height="130" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="220.0" y="220.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">world cargo</text>
<text x="220.0" y="237.5" font-size="11.5" fill="#555555" text-anchor="middle">export types;</text>
<text x="220.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">export booking;</text>
<text x="220.0" y="267.5" font-size="11.5" fill="#555555" text-anchor="middle">export handling;</text>
<text x="220.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">a provider component targets this</text>
<rect x="440" y="180" width="320" height="130" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="600.0" y="220.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">world cargo-consumer</text>
<text x="600.0" y="237.5" font-size="11.5" fill="#555555" text-anchor="middle">import types;</text>
<text x="600.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">import booking;</text>
<text x="600.0" y="267.5" font-size="11.5" fill="#555555" text-anchor="middle">import handling;</text>
<text x="600.0" y="282.5" font-size="11.5" fill="#555555" text-anchor="middle">a caller component targets this</text>
<path d="M340,110 L230,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="291.0" y="139.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">export</text>
<text x="291.0" y="139.0" font-size="11" fill="#555" text-anchor="middle">export</text>
<path d="M480,110 L590,180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="541.0" y="139.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">import</text>
