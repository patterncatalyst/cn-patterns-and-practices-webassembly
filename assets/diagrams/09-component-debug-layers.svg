<text x="590" y="580" font-size="12" fill="#555555" text-anchor="middle">Interactive breakpoint stepping across this same boundary (wasmtime run -g/--gdbstub &lt;PORT&gt;, an LLDB gdbstub) attaches at the native/core level; there is no WIT-aware, per-interface source view yet.</text>
