<text x="32" y="162" font-size="12" font-weight="700" fill="#1d1d1d">Inside: the core module(s) wasm-tools objdump actually reports</text>
<rect x="20" y="378" width="1140" height="180" rx="12" fill="#fff3e0" stroke="#ddd"/>
<text x="32" y="398" font-size="12" font-weight="700" fill="#1d1d1d">What a wasmtime trap backtrace can resolve today, same sentinel panic on both sides</text>
<rect x="300" y="56" width="580" height="56" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="590.0" y="82.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">patterncatalyst:cargo (component)</text>
<text x="590.0" y="99.0" font-size="11.5" fill="#555555" text-anchor="middle">canon lift / canon lower: type-erased core calls become typed WIT calls</text>
<rect x="60" y="184" width="420" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="270.0" y="214.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Core module 0: Rust, cargo-component --release</text>
<text x="270.0" y="231.5" font-size="11.5" fill="#555555" text-anchor="middle">custom &quot;name&quot; section only</text>
<text x="270.0" y="246.5" font-size="11.5" fill="#555555" text-anchor="middle">no .debug_info / .debug_line (no profile.release.debug=true)</text>
<rect x="700" y="184" width="420" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="910.0" y="214.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Core module 0: Go, TinyGo -target=wasip1</text>
<text x="910.0" y="231.5" font-size="11.5" fill="#555555" text-anchor="middle">custom &quot;name&quot; + full DWARF</text>
<text x="910.0" y="246.5" font-size="11.5" fill="#555555" text-anchor="middle">.debug_info/.debug_line/.debug_str embedded by default</text>
<rect x="380" y="288" width="420" height="56" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="590.0" y="314.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">wasi_snapshot_preview1 adapter (vendored .wasm)</text>
<text x="590.0" y="331.0" font-size="11.5" fill="#555555" text-anchor="middle">named functions only; no DWARF either side</text>
<rect x="60" y="418" width="420" height="110" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="270.0" y="456.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Rust __TRAP__ backtrace</text>
<text x="270.0" y="473.0" font-size="11.5" fill="#555555" text-anchor="middle">demangled crate/fn names, 12 frames</text>
<text x="270.0" y="488.0" font-size="11.5" fill="#555555" text-anchor="middle">ends at ...booking@0.1.0#get-cargo</text>
<text x="270.0" y="503.0" font-size="11.5" fill="#555555" text-anchor="middle">file:line: NOT shown (no DWARF to read)</text>
<rect x="700" y="418" width="420" height="110" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="910.0" y="456.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Go __TRAP__ backtrace</text>
<text x="910.0" y="473.0" font-size="11.5" fill="#555555" text-anchor="middle">demangled fn names AND file:line</text>
<text x="910.0" y="488.0" font-size="11.5" fill="#555555" text-anchor="middle">e.g. go/main.go:166:9</text>
<text x="910.0" y="503.0" font-size="11.5" fill="#555555" text-anchor="middle">plus adapter fd_write assert noise on the way out</text>
