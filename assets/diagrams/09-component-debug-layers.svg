<rect x="20" y="16" width="1140" height="110" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="36" font-size="12" font-weight="700" fill="#1d1d1d">Component boundary: canon lift / canon lower glue, no debug info of its own</text>
