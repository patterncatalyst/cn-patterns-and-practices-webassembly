<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="90" width="1140" height="440" rx="12" fill="#f1f5f9" stroke="#ddd"/>
<text x="32" y="110" font-size="12" font-weight="700" fill="#1d1d1d">Pod: cargo-http — two Wasm worlds, one network namespace</text>
<rect x="480" y="20" width="220" height="50" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="590.0" y="43.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">client request</text>
<text x="590.0" y="60.0" font-size="11.5" fill="#555555" text-anchor="middle">GET /cargo/{id}</text>
<rect x="60" y="150" width="480" height="340" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="300.0" y="318.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Envoy sidecar container</text>
<text x="300.0" y="335.0" font-size="11.5" fill="#555555" text-anchor="middle">injected by Istio</text>
<rect x="640" y="150" width="480" height="340" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="880.0" y="318.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">cargo-http container</text>
<text x="880.0" y="335.0" font-size="11.5" fill="#555555" text-anchor="middle">Part 5 Wasm substrate, unchanged</text>
<rect x="100" y="300" width="400" height="150" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="300.0" y="365.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">proxy-wasm filter: cargo-wasmfilter</text>
<text x="300.0" y="382.5" font-size="11.5" fill="#555555" text-anchor="middle">core-module ABI (proxy-wasm crate)</text>
<text x="300.0" y="397.5" font-size="11.5" fill="#555555" text-anchor="middle">loaded by WasmPlugin CR — runs FIRST</text>
<rect x="680" y="300" width="400" height="150" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="880.0" y="365.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">cargo-http component (wasi:http)</text>
<text x="880.0" y="382.5" font-size="11.5" fill="#555555" text-anchor="middle">Component Model ABI (cargo-component)</text>
<text x="880.0" y="397.5" font-size="11.5" fill="#555555" text-anchor="middle">hosted by containerd-shim-wasmtime</text>
<rect x="80" y="555" width="1020" height="110" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="590.0" y="600.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">proxy-wasm core-module ABI (Envoy host) != Component Model (wasmtime host)</text>
<text x="590.0" y="617.5" font-size="11.5" fill="#555555" text-anchor="middle">different toolchain — proxy-wasm crate / plain cargo, not cargo-component</text>
<text x="590.0" y="632.5" font-size="11.5" fill="#555555" text-anchor="middle">different host runtime, same Pod</text>
<path d="M590,70 L300,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="451.0" y="104.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">enters via sidecar first</text>
<text x="451.0" y="104.0" font-size="11" fill="#555" text-anchor="middle">enters via sidecar first</text>
<path d="M500,375 L680,375" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="596.0" y="369.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">to cargo-http component</text>
<text x="596.0" y="369.0" font-size="11" fill="#555" text-anchor="middle">to cargo-http component</text>
<text x="590" y="685" font-size="12" fill="#555555" text-anchor="middle">Istio injects the sidecar; the WasmPlugin-loaded filter runs before the request reaches the Component-Model app.</text>
</svg>