<text x="430" y="25" font-size="13" fill="#1d1d1d" text-anchor="middle" font-weight="700">The host chooses, function by function, what crosses into a guest&#x27;s imports</text>
<text x="430" y="355" font-size="12" fill="#555555" text-anchor="middle">host_fetch, write_file, and open_socket exist in the host process but have no path into this guest at all.</text>
