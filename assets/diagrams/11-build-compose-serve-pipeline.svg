<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="30" y="30" width="320" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="190.0" y="70.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">http-rust/</text>
<text x="190.0" y="87.5" font-size="11.5" fill="#555555" text-anchor="middle">cargo component build --release</text>
<text x="190.0" y="102.5" font-size="11.5" fill="#555555" text-anchor="middle">-&gt; cargo_http_rust.wasm</text>
<rect x="400" y="30" width="320" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="560.0" y="63.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">http-go/</text>
<text x="560.0" y="80.0" font-size="11.5" fill="#555555" text-anchor="middle">bash build.sh (wit-bindgen-go + tinygo</text>
<text x="560.0" y="95.0" font-size="11.5" fill="#555555" text-anchor="middle">+ wasm-tools component new --adapt)</text>
<text x="560.0" y="110.0" font-size="11.5" fill="#555555" text-anchor="middle">-&gt; cargo-http-go.wasm</text>
<rect x="770" y="30" width="250" height="100" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="895.0" y="70.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">part2 provider</text>
<text x="895.0" y="87.5" font-size="11.5" fill="#555555" text-anchor="middle">cargo_rust.wasm / cargo-go.wasm</text>
<text x="895.0" y="102.5" font-size="11.5" fill="#555555" text-anchor="middle">(built from its own recipe, not edited here)</text>
<rect x="300" y="200" width="440" height="90" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="520.0" y="235.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">wac plug --plug &lt;part2 provider&gt; &lt;http component&gt;</text>
<text x="520.0" y="252.5" font-size="11.5" fill="#555555" text-anchor="middle">-o composed.wasm</text>
<text x="520.0" y="267.5" font-size="11.5" fill="#555555" text-anchor="middle">provider = --plug, http component = socket</text>
<rect x="300" y="350" width="440" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="520.0" y="390.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">wasmtime serve -S cli composed.wasm --addr 127.0.0.1:8080</text>
<text x="520.0" y="407.5" font-size="11.5" fill="#555555" text-anchor="middle">curl /cargo/CARGO-USNYC-DEHAM -&gt; 200 JSON</text>
<text x="520.0" y="422.5" font-size="11.5" fill="#555555" text-anchor="middle">curl /cargo/NOPE -&gt; 404 JSON</text>
<path d="M190,130 L450,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="326.0" y="159.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">cargo_http_rust.wasm</text>
<text x="326.0" y="159.0" font-size="11" fill="#555" text-anchor="middle">cargo_http_rust.wasm</text>
<path d="M560,130 L530,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="551.0" y="159.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">cargo-http-go.wasm</text>
<text x="551.0" y="159.0" font-size="11" fill="#555" text-anchor="middle">cargo-http-go.wasm</text>
<path d="M890,130 L650,200" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="776.0" y="159.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">--plug</text>
<text x="776.0" y="159.0" font-size="11" fill="#555" text-anchor="middle">--plug</text>
<path d="M520,290 L520,350" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="526.0" y="314.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">composed.wasm</text>
<text x="526.0" y="314.0" font-size="11" fill="#b8650a" text-anchor="middle">composed.wasm</text>
<text x="520" y="455" font-size="12" fill="#555555" text-anchor="middle">Two toolchains, one WIT world (cargo-http), one wac recipe, one serve command; Rust and Go produce byte-identical responses under wasmtime serve.</text>
</svg>