<rect x="60" y="110" width="290" height="120" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="205.0" y="153.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">cargo-service.wasm</text>
<text x="205.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">targets world cargo</text>
