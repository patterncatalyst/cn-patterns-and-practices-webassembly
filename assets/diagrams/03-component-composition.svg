<rect x="470" y="110" width="290" height="120" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="615.0" y="153.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">gateway.wasm</text>
<text x="615.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">targets world cargo-consumer</text>
<text x="615.0" y="185.0" font-size="11.5" fill="#555555" text-anchor="middle">import booking, import handling</text>
<text x="615.0" y="200.0" font-size="11.5" fill="#555555" text-anchor="middle">(Rust or Go)</text>
