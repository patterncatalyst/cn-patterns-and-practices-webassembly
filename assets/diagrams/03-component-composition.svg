<path d="M350,150 L470,150" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="416.0" y="144.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">cargo&#x27;s export satisfies cargo-consumer&#x27;s import</text>
