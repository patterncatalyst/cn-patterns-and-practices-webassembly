<text x="540" y="430" font-size="12" fill="#555555" text-anchor="middle">host/src/main.rs observes the left/right paths identically: Ok(Err(cargo-error::...)) for a result, an Err from the CALL itself for a trap — regardless of which language produced it.</text>
<text x="540" y="460" font-size="12" fill="#555555" text-anchor="middle">Rust Result&lt;T, CargoError&gt; &lt;-&gt; WIT result&lt;t, cargo-error&gt; &lt;-&gt; Go cm.Result[...]; Rust panic! and Go panic() both become the SAME trap at the boundary.</text>
