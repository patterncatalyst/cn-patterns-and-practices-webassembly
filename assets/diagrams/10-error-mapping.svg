<text x="540.0" y="103.5" font-size="11.5" fill="#555555" text-anchor="middle">  not-found(string), invalid-booking(string),</text>
<text x="540.0" y="118.5" font-size="11.5" fill="#555555" text-anchor="middle">  invalid-location(string), conflict(string) }</text>
